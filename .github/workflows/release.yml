# Triggered by pushing a version tag, e.g.  git tag v0.2.3 && git push --tags
# The tag must match the version in package.json - verify fails the whole
# release otherwise. A pre-release tag (v1.4.0-rc.1) publishes to npm's `next`
# dist-tag and never moves the image's `latest`. Order: verify -> npm (tests,
# publish) -> image -> GitHub Release, so GHCR never gets a version npm lacks.
name: release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm trusted publishing (OIDC) - no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      # authenticates via npm trusted publishing (package settings -> trusted
      # publisher: vikingsearth/projview, release.yml); provenance is automatic
      - run: npm publish --access public --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}

  image:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the image to GHCR (uses the built-in token)
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
